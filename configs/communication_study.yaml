# Compatibility config: same current ResNet-18 non-IID baseline.
# User-confirmed ResNet-18 baseline, full data, eight rounds; shared by all arms.
federation:
  num_clients: 3
  num_rounds: 8
  partition_type: dirichlet
  dirichlet_alpha: 0.3
  seed: 2026
algorithm:
  name: fedavg
  proximal_mu: 0.01
communication:
  uplink_codec: none
model:
  name: resnet18
  pretrained: false
training:
  batch_size: 32
  local_epochs: 1
  learning_rate: 0.0001
  weight_decay: 0.01
dataset:
  name: BloodMNIST
  image_size: 28
  download: false
  max_train_samples: null
  max_val_samples: null
  max_test_samples: null
runtime:
  backend: sequential
  deterministic: true
  torch_num_threads: 8
monitoring:
  enabled: true
evaluation:
  selection_metric: f1_macro
  target_accuracy: 0.8
  max_failure_cases: 100
paths:
  results_dir: results/non_iid_study
  checkpoints_dir: checkpoints/non_iid_study
  runs_dir: runs/non_iid_study
