# Pipeline verification only. These subsets are not research benchmarks.
federation:
  num_clients: 3
  num_rounds: 2
  seed: 42
model:
  name: resnet18
  pretrained: false
training:
  batch_size: 16
  centralized_epochs: 2
dataset:
  name: BloodMNIST
  download: false
  max_train_samples: 32
  max_val_samples: 16
  max_test_samples: 64
runtime:
  backend: sequential
monitoring:
  interval_seconds: 0.05
paths:
  results_dir: results/smoke
  checkpoints_dir: checkpoints/smoke
  runs_dir: runs/smoke
