[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedmedai"
version = "0.2.0"
description = "Reproducible lightweight medical image experiments with PyTorch and Flower"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flwr[simulation]>=1.36.0,<1.37.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "medmnist>=3.0.0",
    "tensorboard>=2.14.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "psutil>=5.9",
    "matplotlib>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["algorithms", "client", "server", "models", "datasets", "monitoring", "experiments"]
